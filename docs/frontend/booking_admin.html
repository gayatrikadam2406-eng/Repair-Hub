<section class="booking-admin">

    <div class="page-title">

        <h1>
            Manage Bookings
        </h1>

        <p>
            View and monitor all customer repair service bookings.
        </p>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Customer</th>

                    <th>Phone</th>

                    <th>Email</th>

                    <th>Service</th>

                    <th>Date</th>

                    <th>Time</th>

                    <th>Problem</th>

                    <th>Status</th>

                </tr>

            </thead>


            <tbody id="bookingTable">

                <tr>

                    <td colspan="9"
                        class="empty-message">

                        Loading bookings...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>


<!-- JAVASCRIPT -->

<script>

    async function loadBookings() {

        const table =
            document.getElementById("bookingTable");

        try {

            const response =
                await fetch(
                    "https://repair-hub-production-94bc.up.railway.app/bookings"
                );

            const bookings =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    "Failed to load bookings"
                );

            }


            if (bookings.length === 0) {

                table.innerHTML = `

                    <tr>

                        <td colspan="9"
                            class="empty-message">

                            No bookings found.

                        </td>

                    </tr>

                `;

                return;

            }


            table.innerHTML = "";


            bookings.forEach(booking => {

                const status =
                    booking.status || "Pending";


                const statusClass =
                    status
                        .toLowerCase()
                        .replaceAll(" ", "-");


                const row = document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${booking.id}
                    </td>

                    <td>
                        ${booking.name}
                    </td>

                    <td>
                        ${booking.phone}
                    </td>

                    <td>
                        ${booking.email}
                    </td>

                    <td>
                        ${booking.service}
                    </td>

                    <td>
                        ${booking.booking_date}
                    </td>

                    <td>
                        ${booking.booking_time}
                    </td>

                    <td>
                        ${booking.problem}
                    </td>

                    <td>

                        <span class="status ${statusClass}">

                            ${status}

                        </span>

                    </td>

                `;


                table.appendChild(row);

            });

        }


        catch (error) {

            console.error(
                "Booking Admin Error:",
                error
            );


            table.innerHTML = `

                <tr>

                    <td colspan="9"
                        class="empty-message">

                        Unable to connect to server.
                        Please make sure the backend is running.

                    </td>

                </tr>

            `;

        }

    }


    // Load bookings when page opens

    loadBookings();

</script>
