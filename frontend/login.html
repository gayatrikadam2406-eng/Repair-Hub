<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Repair Hub</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">

        <a href="index.html">
            Repair Hub
        </a>

    </div>

    <ul>

        <li>
            <a href="index.html">
                Home
            </a>
        </li>

        <li>
            <a href="services.html">
                Services
            </a>
        </li>

        <li>
            <a href="booking.html">
                Book Service
            </a>
        </li>

        <li>
            <a href="contact.html">
                Contact
            </a>
        </li>

    </ul>

    <a href="register.html" class="register-btn">
        Register
    </a>

</nav>


<!-- ================= LOGIN SECTION ================= -->

<section class="register-section">

    <div class="register-container">

        <!-- LEFT IMAGE -->

        <div class="register-image">

            <img
                src="Images/hero.jpg"
                alt="Repair Hub">

        </div>


        <!-- RIGHT LOGIN FORM -->

        <div class="register-form">

            <h2>
                Welcome Back
            </h2>

            <p>
                Login to your Repair Hub account.
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <!-- EMAIL -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                </div>


                <!-- REMEMBER ME -->

                <div
                    style="display:flex;justify-content:space-between;margin-bottom:20px;">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a
                        href="#"
                        style="color:#0d6efd;text-decoration:none;">

                        Forgot Password?

                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="register-btn2">

                    Login

                </button>

            </form>


            <!-- REGISTER LINK -->

            <p class="login-link">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </div>

</section>


<!-- ================= LOGIN JAVASCRIPT ================= -->

<script>

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(e) {

            e.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            try {

                const response =
                    await fetch(
                        "https://repair-hub-production-94bc.up.railway.app/login",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    email: email,

                                    password: password

                                })

                        }
                    );


                const data =
                    await response.json();


                if (response.ok) {

                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );


                    if (data.user && data.user.id) {

                        localStorage.setItem(
                            "userId",
                            data.user.id
                        );

                    }


                    alert(
                        "Login successful!"
                    );


                    window.location.href =
                        "customer-dashboard.html";

                }

                else {

                    alert(
                        data.message ||
                        "Invalid email or password!"
                    );

                }

            }

            catch (error) {

                console.error(
                    "Login Error:",
                    error
                );


                alert(
                    "Server se connection nahi ho raha! " +
                    "Please make sure backend server is running."
                );

            }

        });

</script>

</body>

</html>
