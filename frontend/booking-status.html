<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Status | Repair Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="api-config.js"></script>
    <style>
        .status-section {
            min-height: 80vh;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .status-container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .status-container h2 {
            margin-bottom: 10px;
            font-size: 30px;
        }

        .status-container p {
            color: #666;
            margin-bottom: 25px;
        }

        .status-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .status-input:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
        }

        .check-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .check-btn:hover {
            background: #0b5ed7;
        }

        .booking-result {
            margin-top: 30px;
            text-align: left;
            display: none;
            background: #f8f9fa;
            padding: 22px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
        }

        .booking-result h3 {
            margin-bottom: 15px;
            color: #212529;
            font-size: 20px;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 8px;
        }

        .booking-info {
            margin-bottom: 10px;
            font-size: 15px;
            color: #333;
        }

        .booking-info strong {
            display: inline-block;
            width: 140px;
            color: #495057;
        }

        .booking-status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13.5px;
            text-transform: capitalize;
            margin-top: 5px;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .accepted {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .in-progress {
            background: #cfe2ff;
            color: #084298;
            border: 1px solid #b6d4fe;
        }

        .completed {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .rejected {
            background: #f8d7da;
            color: #842029;
            border: 1px solid #f5c6cb;
        }

        .error-message {
            color: #dc3545;
            margin-top: 20px;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav>
    <div class="logo">
        <a href="index.html">Repair Hub</a>
    </div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="booking.html">Book Service</a></li>
        <li><a href="booking-status.html">Track Booking</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
    </ul>
    <a href="register.html" class="register-btn">Register</a>
</nav>

<!-- ================= BOOKING STATUS SECTION ================= -->
<section class="status-section">
    <div class="status-container">
        <h2>Track Your Booking</h2>
        <p>Enter your Booking ID to check your repair service status.</p>

        <input
            type="number"
            id="bookingId"
            class="status-input"
            placeholder="Enter Booking ID (e.g. 1)"
            required
            min="1"
        >

        <button
            type="button"
            class="check-btn"
            onclick="checkBookingStatus()"
        >
            Check Booking Status
        </button>

        <!-- Booking Result Container -->
        <div id="bookingResult" class="booking-result">
            <h3>Booking Details</h3>

            <div class="booking-info">
                <strong>Booking ID:</strong>
                <span id="resultId"></span>
            </div>

            <div class="booking-info">
                <strong>Customer Name:</strong>
                <span id="resultName"></span>
            </div>

            <div class="booking-info">
                <strong>Service:</strong>
                <span id="resultService"></span>
            </div>

            <div class="booking-info">
                <strong>Date:</strong>
                <span id="resultDate"></span>
            </div>

            <div class="booking-info">
                <strong>Time:</strong>
                <span id="resultTime"></span>
            </div>

            <div class="booking-info">
                <strong>Problem:</strong>
                <span id="resultProblem"></span>
            </div>

            <div class="booking-info">
                <strong>Status:</strong>
                <span id="resultStatus" class="booking-status"></span>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message"></div>
    </div>
</section>

<!-- ================= JAVASCRIPT ================= -->
<script>
    const API_BASE_URL = window.API_BASE_URL || (
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1" ||
        window.location.protocol === "file:"
            ? "http://localhost:5000"
            : (window.location.hostname.includes("vercel.app")
                ? window.location.origin + "/api"
                : "https://repair-hub-backend.onrender.com")
    );

    async function checkBookingStatus() {
        const bookingIdInput = document.getElementById("bookingId");
        const bookingId = bookingIdInput.value.trim();
        const result = document.getElementById("bookingResult");
        const error = document.getElementById("errorMessage");

        // Reset display
        result.style.display = "none";
        error.innerText = "";

        if (!bookingId) {
            error.innerText = "Please enter your Booking ID.";
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/booking-status/${encodeURIComponent(bookingId)}`);
            const data = await response.json();

            if (!response.ok) {
                error.innerText = data.message || "Booking not found!";
                return;
            }

            // Fill details
            document.getElementById("resultId").innerText = data.id;
            document.getElementById("resultName").innerText = data.name || "N/A";
            document.getElementById("resultService").innerText = data.service || "N/A";

            // Format date cleanly (YYYY-MM-DD)
            const cleanDate = data.booking_date ? String(data.booking_date).split("T")[0] : "N/A";
            document.getElementById("resultDate").innerText = cleanDate;

            document.getElementById("resultTime").innerText = data.booking_time || "N/A";
            document.getElementById("resultProblem").innerText = data.problem || "N/A";

            // Status styling
            const statusElement = document.getElementById("resultStatus");
            const rawStatus = data.status || "Pending";
            statusElement.innerText = rawStatus;
            statusElement.className = "booking-status " + rawStatus.toLowerCase().replace(/\s+/g, "-");

            result.style.display = "block";
        } catch (err) {
            console.error("Booking Status Check Error:", err);
            error.innerText = "Unable to connect to the server. Please make sure the backend server is running.";
        }
    }

    // Auto-search if ?id= parameter is present in URL
    window.addEventListener("DOMContentLoaded", function () {
        const params = new URLSearchParams(window.location.search);
        const queryId = params.get("id") || params.get("bookingId");
        if (queryId) {
            document.getElementById("bookingId").value = queryId;
            checkBookingStatus();
        }

        // Support Enter key inside input box
        document.getElementById("bookingId").addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                e.preventDefault();
                checkBookingStatus();
            }
        });
    });
</script>

</body>
</html>
